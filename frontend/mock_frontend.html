<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt OCR — Mock Frontend</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
    .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { border-color: #4A90D9; background: #f0f7ff; }
    .upload-area.has-image { border-style: solid; border-color: #4A90D9; padding: 8px; }
    .upload-area img { max-width: 100%; max-height: 400px; border-radius: 4px; }
    .upload-icon { font-size: 40px; color: #999; margin-bottom: 8px; }
    .upload-text { color: #666; }
    .upload-hint { font-size: 12px; color: #999; margin-top: 4px; }
    .btn-row { display: flex; gap: 8px; margin: 16px 0; }
    .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: 500; }
    .btn-primary { background: #4A90D9; color: white; }
    .btn-primary:hover { background: #357ABD; }
    .btn-primary:disabled { background: #a0c4e8; cursor: not-allowed; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .btn-secondary:hover { background: #d0d0d0; }
    .textbox { width: 100%; min-height: 300px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.5; resize: vertical; white-space: pre; overflow-x: auto; margin-top: 16px; }
    .textbox:focus { outline: none; border-color: #4A90D9; box-shadow: 0 0 0 2px rgba(74,144,217,0.2); }
    .status { font-size: 13px; color: #4A90D9; margin: 8px 0; min-height: 20px; }
    .status.error { color: #d32f2f; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
    .label { font-size: 13px; font-weight: 600; color: #333; margin: 12px 0 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Receipt OCR — Layout Reconstruction</h1>
    <p class="subtitle">Upload a receipt image (PNG/JPEG) and click <strong>Process</strong>.</p>

    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📄</div>
      <div class="upload-text">Click to upload or drag & drop</div>
      <div class="upload-hint">PNG or JPEG only</div>
      <img id="preview" style="display:none" />
    </div>
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" style="display:none" onchange="handleFile(event)" />

    <div class="btn-row">
      <button class="btn btn-primary" id="processBtn" disabled onclick="process()">Process Receipt</button>
      <button class="btn btn-secondary" onclick="saveFile()">Save to File</button>
    </div>

    <div class="status" id="status">Select an image to begin.</div>

    <div class="label">Reconstructed Layout Text (editable)</div>
    <textarea class="textbox" id="layoutText" placeholder="OCR output will appear here..."></textarea>

    <div class="footer">Mock Frontend · Receipt OCR</div>
  </div>

  <script>
    let currentImage = null;

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = document.getElementById('preview');
        img.src = ev.target.result;
        img.style.display = 'block';
        const area = document.getElementById('uploadArea');
        area.classList.add('has-image');
        area.querySelector('.upload-icon').style.display = 'none';
        area.querySelector('.upload-text').style.display = 'none';
        area.querySelector('.upload-hint').style.display = 'none';
        document.getElementById('processBtn').disabled = false;
        document.getElementById('status').textContent = 'Image loaded. Click Process to run OCR.';
        currentImage = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function process() {
      const status = document.getElementById('status');
      const btn = document.getElementById('processBtn');
      btn.disabled = true;
      status.textContent = 'Sending to OCR backend...';
      status.className = 'status';

      // Mock OCR result
      setTimeout(() => {
        const mockLayout =
  `Cash Receipts Journal                                CRJ-101
  Date            Account Credited          PR          Debit                    Credit
  2016                                               Cash  Discount    Sales     A/C R.A  Sundries
Dec.01   A&Co.                              50         500        25                  525
Dec.04   Sam &Co.                           53       4,600        50                4,650
Dec.08   Interest                           44         150                                      150
Dec.15   Sales                                       1,800               1,800
Dec.23   A&Co.                              50         700        30                  730
Dec.24   Office Supplies                    45         400                                      400
Dec.25   Beauty Supply Corporation          55       1,600       100                1,700
Dec.31   Sales                                       2,200               2,200
Dec.31   Total                                       11,950      205     4,000      7,605       55`;
        document.getElementById('layoutText').value = mockLayout;
        status.textContent = 'OCR complete. You can edit the text above.';
        status.className = 'status';
        btn.disabled = false;
      }, 1500);
    }

    function saveFile() {
      const text = document.getElementById('layoutText').value;
      if (!text.trim()) {
        document.getElementById('status').textContent = 'Nothing to save.';
        document.getElementById('status').className = 'status error';
        return;
      }
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'reconstructed_layout.txt';
      a.click();
      URL.revokeObjectURL(a.href);
      document.getElementById('status').textContent = 'File saved!';
      document.getElementById('status').className = 'status';
    }

    // Drag & drop support
    const area = document.getElementById('uploadArea');
    area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = '#4A90D9'; });
    area.addEventListener('dragleave', () => { area.style.borderColor = '#ccc'; });
    area.addEventListener('drop', e => {
      e.preventDefault();
      area.style.borderColor = '#ccc';
      const file = e.dataTransfer.files[0];
      if (file) {
        const input = document.getElementById('fileInput');
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        handleFile({ target: input });
      }
    });
  </script>
</body>
</html>
